name: Release candidate and promotion

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, promote, roll back, or finalize 24-hour release evidence
        required: true
        type: choice
        options:
          - candidate
          - promote
          - rollback
          - finalize
      version:
        description: Exact package version, without a leading v
        required: true
        type: string
      git_ref:
        description: Signed immutable tag for a candidate build, for example v0.1.0
        required: false
        type: string
      evidence_run_id:
        description: Workflow run containing signed candidate evidence for promotion, rollback, or finalization
        required: false
        type: string
      manifest_sha256:
        description: Expected SHA-256 of the signed release manifest for promotion, rollback, or finalization
        required: false
        type: string
      conformance_evidence_run_id:
        description: Promotion/finalize workflow run containing provider conformance evidence
        required: false
        type: string
      conformance_evidence_artifact:
        description: Exact artifact name containing conformance-evidence.json
        required: false
        type: string
      agent_evidence_run_id:
        description: Promotion/finalize workflow run containing validated reference-agent evidence
        required: false
        type: string
      agent_evidence_artifact:
        description: Exact artifact name containing agent-evidence.json
        required: false
        type: string
      release_evidence_run_id:
        description: Promotion/finalize workflow run containing signed combined release evidence
        required: false
        type: string
      release_evidence_artifact:
        description: Exact artifact name containing release-evidence.json and release-evidence.sig
        required: false
        type: string
      release_evidence_signer_fingerprint:
        description: Expected sha256 fingerprint of the combined-evidence Ed25519 public key
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: crosshands-release-${{ inputs.operation == 'candidate' && inputs.version || 'default-channel' }}
  cancel-in-progress: false

env:
  CANDIDATE_TAG: candidate-${{ inputs.version }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_GIT_REF: ${{ inputs.git_ref }}
  RELEASE_OPERATION: ${{ inputs.operation }}
  EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
  EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  CONFORMANCE_EVIDENCE_RUN_ID: ${{ inputs.conformance_evidence_run_id }}
  CONFORMANCE_EVIDENCE_ARTIFACT: ${{ inputs.conformance_evidence_artifact }}
  AGENT_EVIDENCE_RUN_ID: ${{ inputs.agent_evidence_run_id }}
  AGENT_EVIDENCE_ARTIFACT: ${{ inputs.agent_evidence_artifact }}
  RELEASE_EVIDENCE_RUN_ID: ${{ inputs.release_evidence_run_id }}
  RELEASE_EVIDENCE_ARTIFACT: ${{ inputs.release_evidence_artifact }}
  RELEASE_EVIDENCE_SIGNER_FINGERPRINT: ${{ inputs.release_evidence_signer_fingerprint }}

jobs:
  candidate-preflight:
    if: inputs.operation == 'candidate'
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 10
    steps:
      - name: Require an exact signed release tag and configured release services
        shell: bash
        env:
          NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          CROSSHANDS_RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_PEM }}
          CROSSHANDS_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$RELEASE_GIT_REF" = "v$RELEASE_VERSION"
          test -n "$NPM_REGISTRY_URL"
          test -n "$NPM_TOKEN"
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PASSWORD"
          test -n "$COSIGN_PUBLIC_KEY"
          test -n "$CROSSHANDS_RELEASE_PRIVATE_KEY"
          test -n "$CROSSHANDS_RELEASE_PUBLIC_KEY"

      - name: Check out immutable candidate tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Verify signed tag
        shell: bash
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "v$RELEASE_VERSION"
          git verify-tag "v$RELEASE_VERSION"

  candidate-build:
    if: inputs.operation == 'candidate'
    needs: candidate-preflight
    name: Candidate / ${{ matrix.label }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            os: macos
            arch: arm64
          - label: Windows x64
            runner: windows-2022
            os: windows
            arch: x64
          - label: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    environment: release-candidate
    timeout-minutes: 60
    env:
      CROSSHANDS_RELEASE_BUILD: '1'
      CROSSHANDS_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      CROSSHANDS_MACOS_SIGNING_AUTHORITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      CROSSHANDS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      CROSSHANDS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CROSSHANDS_APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      CROSSHANDS_MACOS_TEAM_IDENTIFIER: ${{ secrets.MACOS_TEAM_ID }}
      CROSSHANDS_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      CROSSHANDS_APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      CROSSHANDS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CROSSHANDS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CROSSHANDS_WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
      CROSSHANDS_WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      CROSSHANDS_RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_PEM }}
      CROSSHANDS_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_PUBLIC_KEY_PEM }}

    steps:
      - name: Check out immutable candidate tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Set up Node.js 22 for the one candidate pack
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"

      - name: Require platform signing configuration
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ]; then
            test -n "$CROSSHANDS_CODESIGN_IDENTITY"
            test -n "$CROSSHANDS_MACOS_CERTIFICATE"
            test -n "$CROSSHANDS_MACOS_CERTIFICATE_PASSWORD"
            test -n "$CROSSHANDS_APPLE_TEAM_ID"
            test -n "$CROSSHANDS_APPLE_ID"
            test -n "$CROSSHANDS_APPLE_APP_PASSWORD"
          fi
          if [ "${{ matrix.os }}" = windows ]; then
            test -n "$CROSSHANDS_WINDOWS_CERTIFICATE"
            test -n "$CROSSHANDS_WINDOWS_CERTIFICATE_PASSWORD"
            test -n "$CROSSHANDS_WINDOWS_PUBLISHER"
            test -n "$CROSSHANDS_WINDOWS_TIMESTAMP_URL"
          fi

      - name: Import macOS Developer ID certificate
        if: matrix.os == 'macos'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/crosshands-signing.keychain-db"
          certificate="$RUNNER_TEMP/crosshands-signing.p12"
          printf '%s' "$CROSSHANDS_MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CROSSHANDS_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$GITHUB_RUN_ID" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$CROSSHANDS_CODESIGN_IDENTITY"

      - name: Import Windows Authenticode certificate
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'crosshands-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CROSSHANDS_WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:CROSSHANDS_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.HasPrivateKey) { throw 'Windows signing certificate has no private key' }
          "CROSSHANDS_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CROSSHANDS_WINDOWS_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frozen dependency graph
        run: corepack pnpm install --frozen-lockfile

      - name: Run Node.js 22 release gates
        shell: bash
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build
          corepack pnpm test:native
          corepack pnpm test:security
          corepack pnpm test:lifecycle

      - name: Build the immutable platform candidate once
        run: node scripts/package/candidate.mjs artifacts

      - name: Verify notarized and stapled macOS payload
        if: matrix.os == 'macos'
        shell: bash
        run: |
          archive="$(find artifacts/packages -type f -name '*platform-darwin*.tgz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/crosshands-final-package"
          tar -xzf "$archive" -C "$RUNNER_TEMP/crosshands-final-package"
          app="$RUNNER_TEMP/crosshands-final-package/package/assets/CrossHands Computer Use.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Verify timestamped Windows payload before accepting its hash
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/packages -Filter '*platform-windows*.tgz' | Select-Object -First 1
          if (-not $archive) { throw 'Windows platform archive is missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'crosshands-final-package'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          tar -xzf $archive.FullName -C $destination
          $assets = Join-Path $destination 'package/assets'
          $manifest = Get-Content (Join-Path $assets 'payload.json') -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.files.PSObject.Properties) {
            $payload = Join-Path $assets $entry.Name
            $signature = Get-AuthenticodeSignature -LiteralPath $payload
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $($entry.Name): $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "Authenticode signature for $($entry.Name) has no trusted timestamp" }
            if ($signature.SignerCertificate.Subject -ne $manifest.authenticode.publisher) { throw "Authenticode publisher mismatch for $($entry.Name)" }
            if ($signature.SignerCertificate.Thumbprint -ne $manifest.authenticode.thumbprint) { throw "Authenticode thumbprint mismatch for $($entry.Name)" }
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $payload).Hash.ToLowerInvariant()
            if ($digest -ne $entry.Value) { throw "Payload hash for $($entry.Name) was not recorded after signing" }
          }

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/packages
          format: spdx-json
          output-file: artifacts/release/sbom-${{ matrix.os }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Validate final package evidence
        run: corepack pnpm release:validate

      - name: Remove imported signing material
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ]; then
            security delete-keychain "$RUNNER_TEMP/crosshands-signing.keychain-db" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/crosshands-signing.p12"
          fi
          if [ "${{ matrix.os }}" = windows ]; then
            powershell.exe -NoProfile -NonInteractive -Command \
              'if ($env:CROSSHANDS_WINDOWS_CERTIFICATE_THUMBPRINT) { Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $env:CROSSHANDS_WINDOWS_CERTIFICATE_THUMBPRINT) -Force -ErrorAction SilentlyContinue }; Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "crosshands-signing.pfx") -Force -ErrorAction SilentlyContinue'
          fi

      - name: Upload immutable candidate inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  candidate-compatibility:
    if: inputs.operation == 'candidate'
    needs: candidate-build
    name: Existing candidate / ${{ matrix.label }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            arch: arm64
            node: '24'
            artifact: release-build-macos-arm64
          - label: macOS x64
            runner: macos-15-intel
            arch: x64
            node: '22'
            artifact: release-build-macos-arm64
          - label: macOS x64
            runner: macos-15-intel
            arch: x64
            node: '24'
            artifact: release-build-macos-arm64
          - label: Windows x64
            runner: windows-2022
            arch: x64
            node: '24'
            artifact: release-build-windows-x64
          - label: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            arch: x64
            node: '24'
            artifact: release-build-linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out immutable candidate tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up compatibility Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"

      - name: Download candidate tarballs built by the three canonical builders
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: candidate-input

      - name: Clean-install and smoke the existing tarballs without repacking
        run: node scripts/package/smoke.mjs candidate-input

  candidate-publish:
    if: inputs.operation == 'candidate'
    needs:
      - candidate-build
      - candidate-compatibility
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
      COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      CROSSHANDS_RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_PEM }}
      CROSSHANDS_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
    steps:
      - name: Check out immutable candidate tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: ${{ secrets.NPM_REGISTRY_URL }}

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Download all candidate packages and evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-build-*
          path: candidate-input

      - name: Install release validator
        run: corepack pnpm install --frozen-lockfile

      - name: Bind each runner manifest to the configured release key
        shell: bash
        run: |
          node --input-type=module -e '
            import { appendFile } from "node:fs/promises";
            const key = process.env.CROSSHANDS_RELEASE_PUBLIC_KEY;
            const keys = JSON.stringify({ darwin: key, win32: key, linux: key });
            await appendFile(process.env.GITHUB_ENV, `CROSSHANDS_RUNNER_PUBLIC_KEYS=${keys}\n`);
          '

      - name: Assemble one signed cross-platform candidate
        shell: bash
        run: |
          node scripts/package/aggregate.mjs artifacts \
            darwin=candidate-input/release-build-macos-arm64 \
            win32=candidate-input/release-build-windows-x64 \
            linux=candidate-input/release-build-linux-x64

      - name: Validate aggregate signed-manifest input
        run: corepack pnpm release:validate

      - name: Verify new or byte-identical immutable package versions
        shell: bash
        run: |
          while IFS= read -r -d '' archive; do
            name="$(tar -xOf "$archive" package/package.json | jq -r .name)"
            version="$(tar -xOf "$archive" package/package.json | jq -r .version)"
            test "$version" = "$RELEASE_VERSION"
            if npm view "$name@$version" version --registry "$NPM_REGISTRY_URL" >/dev/null 2>&1; then
              local_integrity="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$archive")"
              remote_integrity="$(npm view "$name@$version" dist.integrity --registry "$NPM_REGISTRY_URL")"
              test "$local_integrity" = "$remote_integrity"
              echo "$name@$version already exists with the signed candidate bytes; resuming"
            fi
          done < <(find artifacts/packages -type f -name '*.tgz' -print0)

      - name: Publish payloads and adapters to the candidate channel
        shell: bash
        run: |
          find artifacts/packages -type f -name '*.tgz' -print0 |
            while IFS= read -r -d '' archive; do
              name="$(tar -xOf "$archive" package/package.json | jq -r .name)"
              if [ "$name" != crosshands ]; then
                version="$(tar -xOf "$archive" package/package.json | jq -r .version)"
                if npm view "$name@$version" version --registry "$NPM_REGISTRY_URL" >/dev/null 2>&1; then
                  npm dist-tag add "$name@$version" "$CANDIDATE_TAG" --registry "$NPM_REGISTRY_URL"
                else
                  npm publish "$archive" --registry "$NPM_REGISTRY_URL" --tag "$CANDIDATE_TAG"
                fi
              fi
            done

      - name: Publish the main package last
        shell: bash
        run: |
          main_archive=""
          while IFS= read -r -d '' archive; do
            if [ "$(tar -xOf "$archive" package/package.json | jq -r .name)" = crosshands ]; then
              main_archive="$archive"
            fi
          done < <(find artifacts/packages -type f -name '*.tgz' -print0)
          test -n "$main_archive"
          main_version="$(tar -xOf "$main_archive" package/package.json | jq -r .version)"
          if npm view "crosshands@$main_version" version --registry "$NPM_REGISTRY_URL" >/dev/null 2>&1; then
            npm dist-tag add "crosshands@$main_version" "$CANDIDATE_TAG" --registry "$NPM_REGISTRY_URL"
          else
            npm publish "$main_archive" --registry "$NPM_REGISTRY_URL" --tag "$CANDIDATE_TAG"
          fi

      - name: Record and verify registry integrity
        shell: bash
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { execFileSync } from "node:child_process";
            import { readdir, readFile, writeFile } from "node:fs/promises";
            import { join } from "node:path";
            const registry = process.env.NPM_REGISTRY_URL;
            const records = [];
            for (const file of (await readdir("artifacts/packages")).filter((name) => name.endsWith(".tgz")).sort()) {
              const archive = join("artifacts/packages", file);
              const manifest = JSON.parse(execFileSync("tar", ["-xOf", archive, "package/package.json"], { encoding: "utf8" }));
              const local = `sha512-${createHash("sha512").update(await readFile(archive)).digest("base64")}`;
              const remote = execFileSync("npm", ["view", `${manifest.name}@${manifest.version}`, "dist.integrity", "--registry", registry], { encoding: "utf8" }).trim();
              if (local !== remote) throw new Error(`registry integrity mismatch: ${manifest.name}`);
              records.push({ name: manifest.name, version: manifest.version, integrity: remote });
            }
            await writeFile("artifacts/release/registry-integrity.json", `${JSON.stringify({ registry, candidateTag: process.env.CANDIDATE_TAG, packages: records }, null, 2)}\n`);
          '

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign release manifest and registry evidence
        shell: bash
        run: |
          test -s artifacts/release/release-manifest.json
          cosign sign-blob --yes --key env://COSIGN_KEY \
            --output-signature artifacts/release/release-manifest.cosign.sig \
            artifacts/release/release-manifest.json
          cosign sign-blob --yes --key env://COSIGN_KEY \
            --output-signature artifacts/release/registry-integrity.cosign.sig \
            artifacts/release/registry-integrity.json
          sha256sum artifacts/release/release-manifest.json | tee artifacts/release/release-manifest.sha256

      - name: Upload signed candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 365

      - name: Publish promotion coordinates
        shell: bash
        run: |
          digest="$(cut -d ' ' -f 1 artifacts/release/release-manifest.sha256)"
          {
            echo '### Immutable candidate ready'
            echo "- version: $RELEASE_VERSION"
            echo "- candidate tag: $CANDIDATE_TAG"
            echo "- release manifest SHA-256: \`$digest\`"
            echo '- promotion must use this run ID and digest; it must not rebuild'
          } >> "$GITHUB_STEP_SUMMARY"

  load-existing-candidate:
    if: inputs.operation == 'promote' || inputs.operation == 'rollback' || inputs.operation == 'finalize'
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
      CROSSHANDS_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
      CROSSHANDS_RELEASE_EVIDENCE_PUBLIC_KEY: ${{ secrets.RELEASE_EVIDENCE_PUBLIC_KEY_PEM }}
    steps:
      - name: Require immutable evidence coordinates
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$COSIGN_PUBLIC_KEY"
          test -n "$CROSSHANDS_RELEASE_PUBLIC_KEY"

      - name: Require exact benchmark evidence coordinates for promotion or finalization
        if: inputs.operation == 'promote' || inputs.operation == 'finalize'
        shell: bash
        run: |
          [[ "$CONFORMANCE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$CONFORMANCE_EVIDENCE_ARTIFACT"
          [[ "$AGENT_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$AGENT_EVIDENCE_ARTIFACT"
          [[ "$RELEASE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$RELEASE_EVIDENCE_ARTIFACT"
          [[ "$RELEASE_EVIDENCE_SIGNER_FINGERPRINT" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -n "$CROSSHANDS_RELEASE_EVIDENCE_PUBLIC_KEY"

      - name: Check out the immutable release validator
        if: inputs.operation == 'promote' || inputs.operation == 'finalize'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set up the pinned validation runtime
        if: inputs.operation == 'promote' || inputs.operation == 'finalize'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download the exact candidate without rebuilding
        shell: bash
        run: |
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-$RELEASE_VERSION" \
            --dir artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify manifest digest and signatures
        shell: bash
        run: |
          actual="$(sha256sum artifacts/release/release-manifest.json | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_MANIFEST_SHA256"
          node --input-type=module -e '
            import { createPublicKey, verify } from "node:crypto";
            import { readFile } from "node:fs/promises";
            function stableJson(value) {
              if (Array.isArray(value)) return `[${value.map(stableJson).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableJson(value[key])}`).join(",")}}`;
              return JSON.stringify(value);
            }
            const manifest = JSON.parse(await readFile("artifacts/release/release-manifest.json", "utf8"));
            const signature = (await readFile("artifacts/release/release-manifest.sig", "utf8")).trim();
            const valid = verify(null, Buffer.from(stableJson(manifest)), createPublicKey(process.env.CROSSHANDS_RELEASE_PUBLIC_KEY), Buffer.from(signature, "base64"));
            if (!valid) throw new Error("CrossHands release manifest signature is invalid");
          '
          printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
          cosign verify-blob --key cosign.pub \
            --signature artifacts/release/release-manifest.cosign.sig \
            artifacts/release/release-manifest.json
          cosign verify-blob --key cosign.pub \
            --signature artifacts/release/registry-integrity.cosign.sig \
            artifacts/release/registry-integrity.json

      - name: Download exact conformance, agent, and combined evidence
        if: inputs.operation == 'promote' || inputs.operation == 'finalize'
        shell: bash
        run: |
          mkdir -p external-evidence/conformance external-evidence/agents external-evidence/combined
          gh run download "$CONFORMANCE_EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$CONFORMANCE_EVIDENCE_ARTIFACT" \
            --dir external-evidence/conformance
          gh run download "$AGENT_EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$AGENT_EVIDENCE_ARTIFACT" \
            --dir external-evidence/agents
          gh run download "$RELEASE_EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$RELEASE_EVIDENCE_ARTIFACT" \
            --dir external-evidence/combined
          test -f external-evidence/conformance/conformance-evidence.json
          test -f external-evidence/agents/agent-evidence.json
          test -f external-evidence/combined/release-evidence.json
          test -f external-evidence/combined/release-evidence.sig

      - name: Verify signed pre-promotion evidence and candidate identity
        if: inputs.operation == 'promote' || inputs.operation == 'finalize'
        shell: bash
        run: |
          printf '%s' "$CROSSHANDS_RELEASE_EVIDENCE_PUBLIC_KEY" > release-evidence.pub
          node benchmarks/agents/validate-prepromotion.mjs

      - name: Validate complete 24-hour release evidence without moving tags
        if: inputs.operation == 'finalize'
        shell: bash
        run: |
          printf '%s' "$CROSSHANDS_RELEASE_PUBLIC_KEY" > release-manifest.pub
          node benchmarks/agents/validate-evidence.mjs \
            --release-evidence external-evidence/combined/release-evidence.json \
            --artifacts artifacts \
            --public-key release-manifest.pub

      - name: Preserve verified evidence for the channel operation
        if: inputs.operation == 'promote' || inputs.operation == 'rollback'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-${{ inputs.operation }}-${{ inputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 365

      - name: Record immutable v1-ready evidence after the 24-hour gate
        if: inputs.operation == 'finalize'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v1-ready-${{ inputs.version }}
          path: |
            artifacts/
            external-evidence/
          if-no-files-found: error
          retention-days: 365

      - name: Publish finalization coordinates without rebuilding or moving tags
        if: inputs.operation == 'finalize'
        shell: bash
        run: |
          {
            echo '### CrossHands v1 evidence declared ready'
            echo "- version: $RELEASE_VERSION"
            echo "- candidate evidence run: $EVIDENCE_RUN_ID"
            echo "- release manifest SHA-256: \`$EXPECTED_MANIFEST_SHA256\`"
            echo '- complete 0/1/6/24-hour evidence passed; this operation did not publish, rebuild, or move a registry tag'
          } >> "$GITHUB_STEP_SUMMARY"

  move-default-channel:
    if: inputs.operation == 'promote' || inputs.operation == 'rollback'
    needs: load-existing-candidate
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
    steps:
      - name: Set up Node.js and registry authentication
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: ${{ secrets.NPM_REGISTRY_URL }}

      - name: Download verified evidence only
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "verified-$RELEASE_OPERATION-$RELEASE_VERSION" \
            --dir artifacts

      - name: Verify candidate-channel versions and registry digests
        shell: bash
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFile } from "node:fs/promises";
            const evidence = JSON.parse(await readFile("artifacts/release/registry-integrity.json", "utf8"));
            if (evidence.registry !== process.env.NPM_REGISTRY_URL) throw new Error("registry changed since candidate publication");
            for (const pkg of evidence.packages) {
              const integrity = execFileSync("npm", ["view", `${pkg.name}@${pkg.version}`, "dist.integrity", "--registry", evidence.registry], { encoding: "utf8" }).trim();
              const candidate = execFileSync("npm", ["view", `${pkg.name}@${evidence.candidateTag}`, "version", "--registry", evidence.registry], { encoding: "utf8" }).trim();
              if (integrity !== pkg.integrity || candidate !== pkg.version) throw new Error(`candidate drift: ${pkg.name}`);
            }
          '

      - name: Promote exact candidate digests without rebuilding
        if: inputs.operation == 'promote'
        shell: bash
        run: |
          jq -r '.packages[] | select(.name != "crosshands") | [.name, .version] | @tsv' artifacts/release/registry-integrity.json |
            while IFS=$'\t' read -r name version; do
              npm dist-tag add "$name@$version" latest --registry "$NPM_REGISTRY_URL"
            done
          main_version="$(jq -r '.packages[] | select(.name == "crosshands") | .version' artifacts/release/registry-integrity.json)"
          test -n "$main_version"
          npm dist-tag add "crosshands@$main_version" latest --registry "$NPM_REGISTRY_URL"

      - name: Roll back the main package first, then the matching bundle
        if: inputs.operation == 'rollback'
        shell: bash
        run: |
          main_version="$(jq -r '.packages[] | select(.name == "crosshands") | .version' artifacts/release/registry-integrity.json)"
          test -n "$main_version"
          npm dist-tag add "crosshands@$main_version" latest --registry "$NPM_REGISTRY_URL"
          jq -r '.packages[] | select(.name != "crosshands") | [.name, .version] | @tsv' artifacts/release/registry-integrity.json |
            while IFS=$'\t' read -r name version; do
              npm dist-tag add "$name@$version" latest --registry "$NPM_REGISTRY_URL"
            done

      - name: Record the auditable channel change
        shell: bash
        run: |
          {
            echo '### Registry channel changed without rebuilding'
            echo "- operation: $RELEASE_OPERATION"
            echo "- version: $RELEASE_VERSION"
            echo "- evidence run: $EVIDENCE_RUN_ID"
            echo "- manifest SHA-256: \`$EXPECTED_MANIFEST_SHA256\`"
            echo '- protected-environment approvers remain responsible for deprecation, canaries, and rollback monitoring'
          } >> "$GITHUB_STEP_SUMMARY"
