name: Tag GitHub Release and npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      git_ref:
        description: Existing signed version tag to release, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref_name }}
  NPM_REGISTRY_URL: https://registry.npmjs.org

jobs:
  github-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - name: Create a GitHub Release for the version tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$RELEASE_GIT_REF"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            extra=(--prerelease)
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            extra=(--latest)
          fi
          if gh release view "$ref" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $ref already exists"
            exit 0
          fi
          gh release create "$ref" --repo "$GITHUB_REPOSITORY" \
            --title "CrossHands $version" \
            --generate-notes \
            "${extra[@]}"

  build:
    name: Build / ${{ matrix.label }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            os: macos
            arch: arm64
          - label: Windows x64
            runner: windows-2022
            os: windows
            arch: x64
          - label: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    environment: release-candidate
    timeout-minutes: 60
    env:
      CROSSHANDS_RELEASE_BUILD: '1'
      CROSSHANDS_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      CROSSHANDS_MACOS_SIGNING_AUTHORITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      CROSSHANDS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      CROSSHANDS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CROSSHANDS_APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      CROSSHANDS_MACOS_TEAM_IDENTIFIER: ${{ secrets.MACOS_TEAM_ID }}
      CROSSHANDS_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      CROSSHANDS_APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      CROSSHANDS_RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_PEM }}
      CROSSHANDS_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
    steps:
      - name: Check out the immutable version tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_GIT_REF }}
          fetch-depth: 0

      - name: Verify signed tag
        shell: bash
        env:
          RELEASE_TAG_ALLOWED_SIGNERS: ${{ vars.RELEASE_TAG_ALLOWED_SIGNERS }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_GIT_REF"
          signers="$RUNNER_TEMP/allowed_signers"
          printf '%s\n' "$RELEASE_TAG_ALLOWED_SIGNERS" > "$signers"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$signers" \
            verify-tag "$RELEASE_GIT_REF"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"

      - name: Require platform signing configuration
        shell: bash
        run: |
          test -n "$CROSSHANDS_RELEASE_PRIVATE_KEY"
          test -n "$CROSSHANDS_RELEASE_PUBLIC_KEY"
          if [ "${{ matrix.os }}" = macos ]; then
            test -n "$CROSSHANDS_CODESIGN_IDENTITY"
            test -n "$CROSSHANDS_MACOS_CERTIFICATE"
            test -n "$CROSSHANDS_MACOS_CERTIFICATE_PASSWORD"
            test -n "$CROSSHANDS_APPLE_TEAM_ID"
            test -n "$CROSSHANDS_APPLE_ID"
            test -n "$CROSSHANDS_APPLE_APP_PASSWORD"
          fi

      - name: Import macOS Developer ID certificate
        if: matrix.os == 'macos'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/crosshands-signing.keychain-db"
          certificate="$RUNNER_TEMP/crosshands-signing.p12"
          printf '%s' "$CROSSHANDS_MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CROSSHANDS_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$GITHUB_RUN_ID" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$CROSSHANDS_CODESIGN_IDENTITY"

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Set product version from the tag
        shell: bash
        run: node scripts/package/set-product-version.mjs "${RELEASE_GIT_REF#v}"

      - name: Build the immutable platform package set once
        run: node scripts/package/candidate.mjs artifacts

      - name: Verify packed version matches the tag
        shell: bash
        run: |
          node --input-type=module -e '
            import { readdir } from "node:fs/promises";
            import { join } from "node:path";
            import { archiveManifest } from "./scripts/package/lib.mjs";
            const directory = "artifacts/packages";
            const files = (await readdir(directory)).filter((name) => name.endsWith(".tgz"));
            if (files.length === 0) throw new Error("no packed tarballs");
            const manifest = await archiveManifest(join(directory, files[0]));
            if (`v${manifest.version}` !== process.env.RELEASE_GIT_REF) {
              throw new Error(`packed ${manifest.version} does not match ${process.env.RELEASE_GIT_REF}`);
            }
          '

      - name: Verify notarized and stapled macOS payload
        if: matrix.os == 'macos'
        shell: bash
        run: |
          archive="$(find artifacts/packages -type f -name '*platform-darwin*.tgz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/crosshands-final-package"
          tar -xzf "$archive" -C "$RUNNER_TEMP/crosshands-final-package"
          app="$RUNNER_TEMP/crosshands-final-package/package/assets/CrossHands Computer Use.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Verify Windows payload hashes
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/packages -Filter '*platform-windows*.tgz' | Select-Object -First 1
          if (-not $archive) { throw 'Windows platform archive is missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'crosshands-final-package'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Push-Location -LiteralPath $archive.DirectoryName
          try {
            tar -xzf $archive.Name -C $destination
          } finally {
            Pop-Location
          }
          $assets = Join-Path $destination 'package/assets'
          $manifest = Get-Content (Join-Path $assets 'payload.json') -Raw | ConvertFrom-Json
          if ($manifest.authenticode.required -eq $true) {
            throw 'Windows payload must ship unsigned'
          }
          foreach ($entry in $manifest.files.PSObject.Properties) {
            $payload = Join-Path $assets $entry.Name
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $payload).Hash.ToLowerInvariant()
            if ($digest -ne $entry.Value) { throw "Payload hash mismatch for $($entry.Name)" }
          }

      - name: Remove imported signing material
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ]; then
            security delete-keychain "$RUNNER_TEMP/crosshands-signing.keychain-db" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/crosshands-signing.p12"
          fi

      - name: Upload immutable tag packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tag-build-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs:
      - github-release
      - build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      CROSSHANDS_RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_PEM }}
      CROSSHANDS_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js for public npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Download all platform package sets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tag-build-*
          path: candidate-input

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Bind each runner manifest to the configured release key
        shell: bash
        run: |
          node --input-type=module -e '
            import { appendFile } from "node:fs/promises";
            const key = process.env.CROSSHANDS_RELEASE_PUBLIC_KEY;
            const keys = JSON.stringify({ darwin: key, win32: key, linux: key });
            await appendFile(process.env.GITHUB_ENV, `CROSSHANDS_RUNNER_PUBLIC_KEYS=${keys}\n`);
          '

      - name: Assemble one signed cross-platform package set
        shell: bash
        run: |
          node scripts/package/aggregate.mjs artifacts \
            darwin=candidate-input/tag-build-macos-arm64 \
            win32=candidate-input/tag-build-windows-x64 \
            linux=candidate-input/tag-build-linux-x64

      - name: Publish payloads, then the main package, to npm
        env:
          NPM_REGISTRY_URL: https://registry.npmjs.org
        run: |
          version="${RELEASE_GIT_REF#v}"
          if [[ "$version" == *-* ]]; then export NPM_DIST_TAG=next
          else export NPM_DIST_TAG=latest
          fi
          node scripts/package/publish-npm.mjs artifacts/packages

      - name: Attach package tarballs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(artifacts/packages/*.tgz)
          test "${#assets[@]}" -gt 0
          if ! gh release view "$RELEASE_GIT_REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            extra=(--latest)
            if [[ "${RELEASE_GIT_REF#v}" == *-* ]]; then extra=(--prerelease); fi
            gh release create "$RELEASE_GIT_REF" --repo "$GITHUB_REPOSITORY" \
              --title "CrossHands ${RELEASE_GIT_REF#v}" \
              --generate-notes \
              "${extra[@]}"
          fi
          gh release upload "$RELEASE_GIT_REF" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Record the public release
        run: |
          version="${RELEASE_GIT_REF#v}"
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          {
            echo '### GitHub Release and npm'
            echo "- tag: \`$RELEASE_GIT_REF\`"
            echo "- version: \`$version\`"
            echo "- npm dist-tag: \`$tag\`"
            echo '- registry: `https://registry.npmjs.org`'
          } >> "$GITHUB_STEP_SUMMARY"

  sync-main-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: tag-release-main-version
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set product version on main to match the tag
        run: node scripts/package/set-product-version.mjs "${RELEASE_GIT_REF#v}"

      - name: Commit and push the product version if main changed
        run: |
          version="${RELEASE_GIT_REF#v}"
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: set product version to ${version}"
          git push origin main
